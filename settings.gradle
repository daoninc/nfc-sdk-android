pluginManagement {
    repositories {
        google()
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20'
    }
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootDir, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()

        // Daon SDK packages — replace credentials with a valid GitHub fine-grained token
        // that has read access to https://github.com/daoninc/sdk-packages
        maven {
            url = uri("https://maven.pkg.github.com/daoninc/sdk-packages/")
            credentials {
                username = localProperties.getProperty("dependencies.username")
                password = localProperties.getProperty("dependencies.token")
            }
        }
    }
}

include ':app'
rootProject.name = "nfc-sdk-android"
